name: release

# Publishes the multi-arch image to GHCR. Runs on a version tag (v0.1.0) and on
# pushes to main (which refresh :edge). The built-in GITHUB_TOKEN already carries
# packages:write, so no PAT or local docker login is involved anywhere.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # A version tag publishes :0.1.0 + :0.1 + :latest; main publishes :edge.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Both arches: customer clusters run amd64 (Proxmox/EKS) and arm64
          # (Graviton). The builder stage is pinned to $BUILDPLATFORM and Go
          # cross-compiles, so this costs one native build per arch, not QEMU.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          # Harbor and some registries reject buildx's attestation manifests.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
